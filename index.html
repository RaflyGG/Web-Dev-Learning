<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandung Tour</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }

        .bg {
            /* Linear gradient overlay + Anime Gedung Sate background */
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.55)), 
                              url("Gambar/GedungSate_anime.jpg");

            /* Hero section height */
            min-height: 70vh;

            /* Center and scale the image nicely */
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .bg h1 {
            font-size: 48px;
            margin: 0 0 12px 0;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
        }

        .bg p {
            font-size: 18px;
            max-width: 600px;
            margin: 0 0 24px 0;
            font-weight: 300;
            color: #f0f0f0;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .cta-btn {
            background-color: #3b82f6;
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }

        .cta-btn:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }
    </style>

</head>

<body>

    <div class="bg">
        <h1>Selamat Datang di Bandung</h1>
        <p>Jelajahi keindahan alam, pesona sejarah, dan kelezatan kuliner di Kota Kembang.</p>
        <a href="#destinasi" class="cta-btn">Mulai Eksplorasi</a>
    </div>
    

</body>

</html>
